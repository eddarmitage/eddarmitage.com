baseURL = "https://eddarmitage.com/"
locale = "en-GB"
title = "Edd Armitage-King"

uglyURLs = true
disableKinds = ["taxonomy", "term"]

[permalinks]
  posts = "/:year/:month/:slug"

[outputFormats.RSS]
  mediaType = "application/rss+xml"
  baseName = "feed"

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML"]
  taxonomy = ["HTML"]
  term = ["HTML"]
  page = ["HTML"]

[markup.goldmark.renderer]
  unsafe = false

[markup.goldmark.extensions.footnote]
  enable = true

[markup.highlight]
  noClasses = false
  style = "monokai"

[params]
  description = "The personal website of a software engineer"
  author = "Edd Armitage-King"
  mainSections = ["posts", "photos", "food"]

  [params.assets]
    favicon = "assets/favicon.ico"
    favicon16x16 = "assets/favicon-16x16.png"
    favicon32x32 = "assets/favicon-32x32.png"
    apple_touch_icon = "assets/apple-touch-icon.png"
    safari_pinned_tab = "assets/safari-pinned-tab.svg"
    theme_color = "#ffffff"
    msapplication_TileColor = "#da532c"

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/eddarmitage"

  [[params.socialIcons]]
    name = "instagram"
    url = "https://www.instagram.com/eddarmitage"

  [[params.socialIcons]]
    name = "linkedin"
    url = "https://www.linkedin.com/in/eddarmitage"

[[menu.main]]
  identifier = "posts"
  name = "Posts"
  url = "/posts/"
  weight = 10

[[menu.main]]
  identifier = "projects"
  name = "Projects"
  url = "/projects/"
  weight = 20

[[menu.main]]
  identifier = "photos"
  name = "Photos"
  url = "/photos/"
  weight = 30

