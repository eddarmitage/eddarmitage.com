baseURL = "https://eddarmitage.com/"
locale = "en-GB"
title = "Edd Armitage-King"

uglyURLs = true
disableKinds = ["taxonomy", "term"]

[permalinks]
  posts = "/:year/:slug"

[outputFormats.RSS]
  mediaType = "application/rss+xml"
  baseName = "feed"

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML"]
  taxonomy = ["HTML"]
  term = ["HTML"]
  page = ["HTML"]

[markup.goldmark.renderer]
  unsafe = false

[markup.goldmark.extensions.footnote]
  enable = true

[markup.highlight]
  noClasses = false
  style = "monokai"

[params]
  description = "The personal website of a software engineer"
  author = "Edd Armitage-King"
  mainSections = ["posts", "photos", "food"]

  # Overridden to "dev" for preview deployments via the HUGO_PARAMS_FAVICONENV
  # env var set in scripts/build.sh, so preview tabs are visually
  # distinguishable from production. See params.assetsDev below.
  faviconEnv = "prod"

  [params.assets]
    favicon = "assets/favicon.ico"
    faviconSvg = "assets/favicon.svg"
    favicon16x16 = "assets/favicon-16x16.png"
    favicon32x32 = "assets/favicon-32x32.png"
    favicon48x48 = "assets/favicon-48x48.png"
    appleTouchIcon = "assets/apple-touch-icon.png"
    webmanifest = "assets/site.webmanifest"
    logo = "assets/android-chrome-512x512.png"
    theme_color = "#f19e54"
    theme_color_dark = "#7a4a1f"

  [params.assetsDev]
    favicon = "assets/favicon-dev.ico"
    faviconSvg = "assets/favicon-dev.svg"
    favicon16x16 = "assets/favicon-16x16-dev.png"
    favicon32x32 = "assets/favicon-32x32-dev.png"
    favicon48x48 = "assets/favicon-48x48-dev.png"
    appleTouchIcon = "assets/apple-touch-icon-dev.png"
    webmanifest = "assets/site-dev.webmanifest"
    logo = "assets/android-chrome-512x512-dev.png"
    theme_color = "#9b4f96"
    theme_color_dark = "#5e3660"

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/eddarmitage"

  [[params.socialIcons]]
    name = "instagram"
    url = "https://www.instagram.com/eddarmitage"

  [[params.socialIcons]]
    name = "linkedin"
    url = "https://www.linkedin.com/in/eddarmitage"

[[menu.main]]
  identifier = "posts"
  name = "Posts"
  url = "/posts/"
  weight = 10

[[menu.main]]
  identifier = "projects"
  name = "Projects"
  url = "/projects"
  weight = 20

[[menu.main]]
  identifier = "photos"
  name = "Photos"
  url = "/photos/"
  weight = 30

