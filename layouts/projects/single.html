{{- define "main" }}
<section class="page-section">
  <h1 class="title">{{ .Title }}</h1>
  {{- with .Params.links }}
  <div class="project-links">
    {{- range . }}
    <a href="{{ .url }}" target="_blank" rel="noopener noreferrer">{{ .label }} &rarr;</a>
    {{- end }}
  </div>
  {{- end }}
  <div class="page-body">
    {{ .Content }}
  </div>
</section>
{{- end }}{{/* end main */}}
