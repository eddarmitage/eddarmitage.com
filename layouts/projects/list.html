{{- define "main" }}
<section class="projects-section">
  <h1>{{ .Title }}</h1>
  <div class="projects-grid">
    {{- range .Pages.ByTitle }}
    <article class="project-card" id="{{ .File.ContentBaseName }}">
      <h2>{{ .Title }}</h2>
      <div class="project-card-body">
        {{ .Content }}
      </div>
      {{- with .Params.links }}
      <div class="project-links">
        {{- range . }}
        <a href="{{ .url }}" target="_blank" rel="noopener noreferrer">{{ .label }} &rarr;</a>
        {{- end }}
      </div>
      {{- end }}
    </article>
    {{- end }}
    <article class="project-card empty-state">
      <div class="eyebrow">More soon</div>
      <p>Future things I make and do will appear here.</p>
    </article>
  </div>
</section>
{{- end }}{{/* end main */}}
